name: Docker - Manager

on:
  push:
    branches: ["main"]
    tags: [ "v*"]
    paths:
      - "Manager/**"
      - "Shared/**"
      - ".github/workflows/docker-manager.yml"
      - ".github/workflows/tests.yml"
      - ".github/scripts/upgrade-test.sh"

  workflow_dispatch:
    inputs:
      previous_version:
        description: "Released version to upgrade from (Docker Hub tag, e.g. 1.2.0)"
        default: "latest"
        required: false

jobs:
  tests:
    if: github.ref_type == 'tag'
    uses: ./.github/workflows/tests.yml

  # Builds the candidate image and starts it on data written by the currently released image
  # (Docker Hub 'latest' — what users run today), so upgrade-only failures are caught before release.
  upgrade-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build candidate image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Manager/Dockerfile
          push: false
          load: true
          tags: featureswitcher-manager:candidate

      - name: Upgrade from previous release
        run: |
          bash .github/scripts/upgrade-test.sh manager \
            "${{ secrets.DOCKERHUB_USERNAME }}/featureswitcher-manager:${{ inputs.previous_version || 'latest' }}" \
            featureswitcher-manager:candidate

  release:
    if: github.ref_type == 'tag'
    needs: [tests, upgrade-test]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ${{ secrets.DOCKERHUB_USERNAME }}/featureswitcher-manager
          tags: |
            type=raw,value=latest
            type=semver,pattern={{version}}

      - name: Build & push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Manager/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_VERSION=${{ steps.meta.outputs.version }}
